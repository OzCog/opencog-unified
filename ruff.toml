# Ruff configuration for OpenCog Unified Repository
# https://docs.astral.sh/ruff/configuration/

# Target Python version
target-version = "py311"

# Line length
line-length = 120

# Exclude directories
exclude = [
    ".git",
    ".github",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
    "venv",
    # Submodule / vendored component directories
    "atomspace",
    "atomspace-restful",
    "atomspace-rocks",
    "atomspace-storage",
    "asmoses",
    "atenspace",
    "attention",
    "cogserver",
    "cogutil",
    "cogzero",
    "components",
    "hypermind",
    "language-learning",
    "learn",
    "lg-atomese",
    "miner",
    "moses",
    "opencog",
    "pln",
    "spacetime",
    "unify",
    "ure",
]

[lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "E101",    # Mixed tabs/spaces (occurs in embedded Makefile strings with required tabs)
    "B008",    # Do not perform function calls in argument defaults
    "B007",    # Unused loop control variable (common in iteration patterns)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLW2901", # Redefined loop name (common in text processing)
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "SIM102",  # Collapsible if statements (readability choice)
    "SIM108",  # Use ternary operator
    "PLC0415", # Import outside top-level (conditional imports are intentional)
    "PLW1510", # subprocess.run without check (many scripts use returncode)
    "RUF001",  # Ambiguous unicode character in string (intentional in docs)
    "RUF002",  # Ambiguous unicode character in docstring
    "RUF003",  # Ambiguous unicode character in comment
    "RUF012",  # Mutable class default (ClassVar annotation not needed here)
    "E741",    # Ambiguous variable name (single-letter vars OK in math/science code)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Tests can use magic values and assertions
"**/tests/**/*.py" = ["PLR2004", "S101"]
"**/test_*.py" = ["PLR2004", "S101"]
# Integration tests import modules to test availability
"tests/integration/*.py" = ["F401"]
# Scripts can have different requirements
"scripts/*.py" = ["T201", "PLR2004"]

[lint.isort]
known-first-party = ["opencog"]
force-single-line = false
lines-after-imports = 2

[lint.mccabe]
max-complexity = 15

[format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Unix-style line endings
line-ending = "lf"
# Enable auto-detection of magic trailing comma
skip-magic-trailing-comma = false
