name: 🌌 Genesis of Cognitive Build Issues

# This workflow generates the canonical set of "Cognitive Layer" build issues
# (Foundation, Core, Logic, Cognitive, Advanced, Learning, Language, Robotics,
# Integration) using the GitHub CLI. It is split from the (previously broken)
# heredoc implementation into a discrete, validated JSON manifest that is
# rendered with `jq`, ensuring the workflow is parseable, idempotent, and
# extensible. Issues are created with `gh issue create` and labelled per layer.
#
# Trigger: workflow_dispatch only — this is intentionally manual to avoid
# duplicate issue creation. Enable `dry_run` to preview what would be created.

permissions:
  contents: read
  issues: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview issues without creating them"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      label_prefix:
        description: "Prefix for cognitive-layer labels"
        required: false
        default: "cognitive"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-cognitive-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate cognitive-issues manifest
        id: validate
        run: |
          set -euo pipefail
          MANIFEST=".github/cognitive-issues/manifest.json"
          if [[ ! -f "${MANIFEST}" ]]; then
            echo "::error::Cognitive issues manifest not found at ${MANIFEST}"
            exit 1
          fi
          # Strict JSON validation
          jq -e 'type == "array" and (length > 0)' "${MANIFEST}" >/dev/null
          COUNT=$(jq 'length' "${MANIFEST}")
          echo "count=${COUNT}" >> "${GITHUB_OUTPUT}"
          echo "✅ Manifest validated: ${COUNT} cognitive layer issues"

      - name: Render issue previews
        run: |
          set -euo pipefail
          MANIFEST=".github/cognitive-issues/manifest.json"
          {
            echo "## 🌌 Cognitive Issues to be Generated"
            echo ""
            jq -r '.[] | "### " + .title + "\n\n**Layer:** `" + .layer + "`  \n**Labels:** " + (.labels | join(", ")) + "\n\n" + .body + "\n\n---\n"' "${MANIFEST}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create cognitive layer issues
        if: ${{ inputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL_PREFIX: ${{ inputs.label_prefix }}
        run: |
          set -euo pipefail
          MANIFEST=".github/cognitive-issues/manifest.json"
          CREATED=0
          while IFS= read -r entry; do
            TITLE=$(echo "${entry}" | jq -r '.title')
            BODY=$(echo "${entry}" | jq -r '.body')
            LAYER=$(echo "${entry}" | jq -r '.layer')
            LABELS=$(echo "${entry}" | jq -r '.labels | join(",")')
            FULL_LABELS="${LABEL_PREFIX}-layer,${LABEL_PREFIX}/${LAYER},${LABELS}"
            echo "📝 Creating issue: ${TITLE}"
            if gh issue create \
              --title "${TITLE}" \
              --body "${BODY}" \
              --label "${FULL_LABELS}" 2>/tmp/gh.err; then
              CREATED=$((CREATED + 1))
            else
              echo "::warning::Failed to create issue '${TITLE}': $(cat /tmp/gh.err)"
            fi
          done < <(jq -c '.[]' "${MANIFEST}")
          echo "✅ Created ${CREATED} cognitive layer issues" >> "${GITHUB_STEP_SUMMARY}"

      - name: Dry-run summary
        if: ${{ inputs.dry_run != 'false' }}
        run: |
          echo "ℹ️  Dry run mode — no issues were created." >> "${GITHUB_STEP_SUMMARY}"
          echo "Re-run the workflow with \`dry_run: false\` to create them." >> "${GITHUB_STEP_SUMMARY}"
