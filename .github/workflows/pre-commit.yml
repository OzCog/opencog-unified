# Pre-commit CI workflow for OpenCog Unified Repository
name: 🔍 Pre-commit Checks

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: "🔍 Code Quality Checks"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for better diff analysis

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "📦 Install Dependencies"
        run: |
          pip install --upgrade pip
          pip install pre-commit

      - name: "💾 Cache Pre-commit"
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: "🔍 Run Pre-commit Hooks"
        run: |
          # Run pre-commit on changed files for PRs, all files for pushes to main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}
          else
            pre-commit run --all-files
          fi

      - name: "📊 Generate Report"
        if: always()
        run: |
          # Read prior step status from `job.status` (success / failure /
          # cancelled). `$?` of the preceding `echo` is always 0, so SC2181
          # / SC2320 — read the GitHub job context instead.
          {
            echo "## Pre-commit Check Results"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ All checks passed!"
            else
              echo "❌ Some checks failed. Please review the logs above."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  yaml-lint:
    name: "📋 YAML Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6

      - name: "🔍 Lint YAML Files"
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yaml
          file_or_dir: .github/workflows/
          strict: false

  actionlint:
    name: "⚙️ GitHub Actions Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6

      - name: "🔍 Lint GitHub Actions"
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-review
          fail_on_error: true

  shellcheck:
    name: "🐚 Shell Script Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6

      - name: "🔍 Run ShellCheck"
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning
          check_together: 'yes'
          additional_files: '*.sh'
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2086 -e SC2034

  python-lint:
    name: "🐍 Python Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: "📦 Install Ruff"
        run: pip install ruff

      - name: "🔍 Run Ruff Linter"
        run: ruff check . --output-format=github

      - name: "🎨 Run Ruff Formatter Check"
        run: ruff format --check .

  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v6

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: "📦 Install detect-secrets"
        run: pip install detect-secrets

      - name: "🔍 Scan for Secrets"
        run: |
          detect-secrets scan --baseline .secrets.baseline
          detect-secrets audit .secrets.baseline --report --json > /dev/null || true
