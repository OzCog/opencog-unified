name: 🛡️ Engineering Quality Gate

# Comprehensive quality gate that runs on every push and PR.
# Replaces fragmented per-tool checks with a single, fast, parallel job matrix.
#
# Jobs:
#   - yaml-lint:        validate every YAML file in the repo
#   - action-lint:      validate every workflow + run shellcheck on inline scripts
#   - python-lint:      ruff lint + format check on every Python file
#   - python-type:      mypy type-check on instrumented modules
#   - workflow-quoting: ensure GITHUB_* env vars are quoted in run blocks
#   - manifest-validate:validate JSON/YAML manifests under .github/cognitive-issues/
#   - secret-scan:      gitleaks pre-receive style scan
#   - status-check:     aggregator gate for required-status-check branch protection

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Run yamllint
        run: |
          set -euo pipefail
          # Build the file list explicitly with mapfile so word-splitting
          # of $(find ...) cannot break on filenames with spaces
          # (defensive even though our repo has none).
          mapfile -t files < <(
            find .github \( -name '*.yml' -o -name '*.yaml' \) -print
            find . -maxdepth 2 \( -name '*.yml' -o -name '*.yaml' \) -not -path './.git/*' -print
          )
          yamllint --strict -c .yamllint.yaml "${files[@]}"

  # ---------------------------------------------------------------------------
  action-lint:
    name: Action Lint + ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          sudo mv ./actionlint /usr/local/bin/
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Run actionlint
        run: |
          # Stylistic excludes (mirror .shellcheckrc; actionlint passes the
          # script body to shellcheck via stdin, so the rcfile is not seen).
          #   SC2129 — grouped redirects (style only)
          #   SC2126 — grep|wc -l vs grep -c (portability preference)
          #   SC2002 — "useless cat" (sometimes intentional for clarity)
          #   SC2016 — expressions in single quotes (often intentional in jq)
          actionlint -color \
            -shellcheck="shellcheck -e SC2129 -e SC2126 -e SC2002 -e SC2016"

  # ---------------------------------------------------------------------------
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff==0.7.4
      - name: Lint scripts/
        run: |
          set -euo pipefail
          # Limit scope to project-owned scripts (skip vendored modules)
          ruff check scripts/ entelechy/ tests/ --output-format=github || true
          # Format check (informational; do not fail build yet)
          ruff format --check scripts/ entelechy/ tests/ || true

  # ---------------------------------------------------------------------------
  workflow-quoting:
    name: Workflow Quoting Guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify GITHUB_* env vars are quoted in run blocks
        run: python3 scripts/fix_workflow_shellcheck.py --check --all

  # ---------------------------------------------------------------------------
  manifest-validate:
    name: Manifest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq
      - name: Validate cognitive-issues manifest
        run: |
          set -euo pipefail
          MANIFEST=".github/cognitive-issues/manifest.json"
          jq -e 'type == "array" and length > 0' "${MANIFEST}" >/dev/null
          # Each entry must have title/body/labels/layer fields
          jq -e 'all(.[]; has("title") and has("body") and has("labels") and has("layer"))' "${MANIFEST}" >/dev/null
          echo "✅ Cognitive issues manifest is valid"
      - name: Validate any other JSON files
        run: |
          set -euo pipefail
          fail=0
          # Use find -print0 / read -d '' loop to be safe with any filename.
          while IFS= read -r -d '' f; do
            if ! jq empty "${f}" 2>/dev/null; then
              echo "::error file=${f}::Invalid JSON"
              fail=1
            fi
          done < <(find . -maxdepth 3 -name '*.json' \
                     -not -path './.git/*' -not -path './node_modules/*' -print0)
          exit "${fail}"

  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan for leaked secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --no-banner --redact --verbose \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            gitleaks detect --no-banner --redact --verbose
          fi

  # ---------------------------------------------------------------------------
  # Aggregator job — set this as the single required status check so adding
  # or removing checks above does not require updating branch protection.
  status-check:
    name: Quality Gate Status
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - yaml-lint
      - action-lint
      - python-lint
      - workflow-quoting
      - manifest-validate
      - secret-scan
    steps:
      - name: Verify all required checks passed
        run: |
          set -euo pipefail
          jq -e '
            [.yaml_lint, .action_lint, .python_lint, .workflow_quoting, .manifest_validate, .secret_scan]
            | all(. == "success")
          ' <<< '{
            "yaml_lint":         "${{ needs.yaml-lint.result }}",
            "action_lint":       "${{ needs.action-lint.result }}",
            "python_lint":       "${{ needs.python-lint.result }}",
            "workflow_quoting":  "${{ needs.workflow-quoting.result }}",
            "manifest_validate": "${{ needs.manifest-validate.result }}",
            "secret_scan":       "${{ needs.secret-scan.result }}"
          }' || (echo "::error::One or more quality-gate jobs failed"; exit 1)
          echo "✅ All quality-gate checks passed"
