        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build PLN
      if: hashFiles('pln/CMakeLists.txt') != ''
      run: |
        set -eu
        cd pln/build
        make ${{ env.MAKEFLAGS }}

    - name: Build Tests
      if: hashFiles('pln/CMakeLists.txt') != ''
      run: |
        set -eu
        cd pln/build
        make ${{ env.MAKEFLAGS }} tests
      continue-on-error: true

    - name: Run Tests
      if: hashFiles('pln/CMakeLists.txt') != ''
      run: |
        set -eu
        cd pln/build
        make check ARGS="${{ env.MAKEFLAGS }}"
      continue-on-error: true

    - name: Install PLN
      if: hashFiles('pln/CMakeLists.txt') != ''
      run: |
        set -eu
        cd pln/build
        sudo make install
        sudo ldconfig

  # Stage 13: Build Learn (depends on CogServer)
  build-learn:
    runs-on: ubuntu-latest
    name: Build Learn
    needs: build-cogserver

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Install Dependencies
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          cxxtest \
          binutils-dev \
          libiberty-dev \
          libboost-dev \
          libboost-filesystem-dev \
          libboost-program-options-dev \
          libboost-system-dev \
          libboost-thread-dev \
          guile-3.0-dev \
          libasio-dev \
          \
          python3-nose \
          python3-dev \
          valgrind \
          doxygen
        # Pin cmake 3.28 to avoid CMP0175 generate-step cycle check in cmake 3.31+
        sudo rm -f /usr/local/bin/cmake /usr/local/bin/cpack /usr/local/bin/ctest

    - name: Verify Asio Installation
      run: |
        set -eu
        echo "Checking for Asio installation..."
        ls -la /usr/include/asio.hpp || echo "WARNING: asio.hpp not found in /usr/include"
        ls -la /usr/share/pkgconfig/asio.pc || echo "WARNING: asio.pc not found"
        pkg-config --modversion asio || echo "WARNING: Asio not found via pkg-config"
        pkg-config --cflags asio || echo "WARNING: Could not get Asio cflags"

    - name: Rebuild and Install CogUtil
      run: |
        set -eu
        mkdir -p cogutil/build
        cd cogutil/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Rebuild and Install AtomSpace
      run: |
        set -eu
        mkdir -p atomspace/build
        cd atomspace/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_DISABLE_FIND_PACKAGE_Cxxtest=TRUE
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Rebuild and Install AtomSpace Storage
      # Note: atomspace-storage is optional, so we continue even if it fails
      if: hashFiles('atomspace-storage/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p atomspace-storage/build
        cd atomspace-storage/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig
      continue-on-error: true

    - name: Rebuild and Install CogServer
      if: hashFiles('cogserver/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p cogserver/build
        cd cogserver/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Check Learn Directory
      run: |
        set -eu
        if [ -d "learn" ]; then
          echo "Learn directory exists"
          ls -la learn/
        else
          echo "Learn directory not found, skipping build"
          exit 0
        fi

    - name: Configure Learn
      if: hashFiles('learn/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p learn/build
        cd learn/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build Learn
      if: hashFiles('learn/CMakeLists.txt') != ''
      run: |
        set -eu
        cd learn/build
        make ${{ env.MAKEFLAGS }}

    - name: Build Tests
      if: hashFiles('learn/CMakeLists.txt') != ''
      run: |
        set -eu
        cd learn/build
        make ${{ env.MAKEFLAGS }} tests
      continue-on-error: true

    - name: Run Tests
      if: hashFiles('learn/CMakeLists.txt') != ''
      run: |
        set -eu
        cd learn/build
        make check ARGS="${{ env.MAKEFLAGS }}"
      continue-on-error: true

    - name: Install Learn
      if: hashFiles('learn/CMakeLists.txt') != ''
      run: |
        set -eu
        cd learn/build
        sudo make install
        sudo ldconfig

  # Final Stage: Package and Report
  package-and-report:
    runs-on: ubuntu-latest
    name: Package OCC Build
    needs:
      - build-miner
      - build-attention
      - build-asmoses
      - build-matrix
      - build-spacetime
      - build-pln
      - build-learn
      - build-atomspace-rocks
      - build-atomspace-cog
    if: always()

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Download All Artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts
      continue-on-error: true

    - name: Generate Build Report
      run: |
        set -eu
        {
          echo "# OCC Build Report"
          echo ""
          echo "## Build Summary"
          echo "Build completed at: $(date)"
          echo ""
          echo "## Components Built"
          echo ""

          if [ -d "artifacts" ]; then
            echo "### Artifacts Generated:"
            ls -lh artifacts/
          else
            echo "No artifacts found"
          fi

          echo ""
          echo "## Build Order"
          echo "1. CogUtil (Foundation)"
          echo "2. AtomSpace (Hypergraph DB)"
          echo "3. AtomSpace Storage (Storage backends)"
          echo "3b. AtomSpace Rocks (RocksDB storage)"
          echo "4. CogServer (Networking)"
          echo "4b. AtomSpace Cog (Network storage)"
          echo "5. Unify (Unification)"
          echo "6. URE (Unified Rule Engine)"
          echo "7. Miner (Pattern Mining)"
          echo "8. Attention (Attention Allocation)"
          echo "9. AS-MOSES (Meta-Optimizing Semantic Evolutionary Search)"
          echo "10. Matrix (Sparse Vector/Matrix operations)"
          echo "11. SpaceTime (Spatiotemporal representation)"
          echo "12. PLN (Probabilistic Logic Networks)"
          echo "13. Learn (Language Learning)"
          echo ""
          echo "## Notes"
          echo "- This workflow mirrors the CircleCI configuration"
          echo "- Components are built in dependency order"
        } > BUILD_REPORT.md
        echo "- Tests are run but allowed to fail (continue-on-error)" >> BUILD_REPORT.md
        echo "- Build artifacts are cached for 1 day" >> BUILD_REPORT.md

        cat BUILD_REPORT.md

    - name: Upload Build Report
      uses: actions/upload-artifact@v6
      with:
        name: occ-build-report
        path: BUILD_REPORT.md
        retention-days: 30
