name: OCC Build - Complete Stack

# This workflow builds the OpenCog Collection (OCC) monorepo
# Based on CircleCI configurations and CMakeLists.txt from various components
# Builds components in dependency order: cogutil -> atomspace -> cogserver -> attention -> unify -> ure -> miner -> asmoses

permissions:
  contents: read
  actions: read


# NOTE: This workflow rebuilds dependencies multiple times.
# Consider using Docker images or build artifacts to optimize build time.
# See: https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  MAKEFLAGS: -j2

jobs:
  # Stage 1: Build CogUtil (Foundation)
  build-cogutil:
    runs-on: ubuntu-latest
    name: Build CogUtil

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Cache CCache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache
        key: ccache-cogutil-${{ runner.os }}-${{ hashFiles('cogutil/**') }}
        restore-keys: |
          ccache-cogutil-${{ runner.os }}-

    - name: Install Dependencies
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y \
        build-essential \
        cmake \
        cxxtest \
        binutils-dev \
        libiberty-dev \
        libboost-dev \
        libboost-filesystem-dev \
        libboost-program-options-dev \
        libboost-system-dev \
        libboost-thread-dev \
        libboost-regex-dev \
        python3-nose \
        valgrind \
        doxygen \
        ccache
        # Pin cmake 3.28 to avoid CMP0175 generate-step cycle check in cmake 3.31+
        sudo rm -f /usr/local/bin/cmake /usr/local/bin/cpack /usr/local/bin/ctest

    - name: Configure CogUtil
      run: |
        set -eu
        mkdir -p cogutil/build
        cd cogutil/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build CogUtil
      run: |
        set -eu
        cd cogutil/build
        make ${{ env.MAKEFLAGS }}

    - name: Build CogUtil Tests
      run: |
        set -eu
        cd cogutil/build
        make ${{ env.MAKEFLAGS }} tests

    - name: Run CogUtil Tests
      run: |
        set -eu
        cd cogutil/build
        make check ARGS="${{ env.MAKEFLAGS }}"
      continue-on-error: true

    - name: Print Test Log
      if: always()
      run: |
        set -eu
        if [ -f cogutil/build/tests/Testing/Temporary/LastTest.log ]; then
          cat cogutil/build/tests/Testing/Temporary/LastTest.log
        fi

    - name: Install CogUtil
      run: |
        set -eu
        cd cogutil/build
        sudo make install
        sudo ldconfig

    - name: Upload CogUtil Build
      uses: actions/upload-artifact@v6
      with:
        name: cogutil-build
        path: |
          cogutil/build/**/*.so*
          cogutil/build/**/*.a
        retention-days: 1

  # Stage 2: Build AtomSpace (depends on CogUtil)
  build-atomspace:
    runs-on: ubuntu-latest
    name: Build AtomSpace
    needs: build-cogutil

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Cache CCache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache
        key: ccache-atomspace-${{ runner.os }}-${{ hashFiles('atomspace/**') }}
        restore-keys: |
          ccache-atomspace-${{ runner.os }}-

    - name: Cache GHC
      uses: actions/cache@v5
      with:
        path: ~/.stack
        key: ghc-${{ runner.os }}-${{ hashFiles('atomspace/opencog/haskell/stack.yaml') }}
        restore-keys: |
          ghc-${{ runner.os }}-

    - name: Cache Haskell Dependencies
      uses: actions/cache@v5
      with:
        path: atomspace/opencog/haskell/.stack-work
        key: haskelldeps-${{ runner.os }}-${{ hashFiles('atomspace/opencog/haskell/stack.yaml', 'atomspace/opencog/haskell/opencog-atomspace.cabal') }}
        restore-keys: |
          haskelldeps-${{ runner.os }}-

    - name: Install Dependencies
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          cxxtest \
          binutils-dev \
          libiberty-dev \
          libboost-dev \
          libboost-filesystem-dev \
          libboost-program-options-dev \
          libboost-system-dev \
          libboost-thread-dev \
          libboost-regex-dev \
          guile-3.0-dev \
          libgmp-dev \
          \
          python3-nose \
          python3-dev \
          python3-pip \
          valgrind \
          doxygen \
          ccache
        # Pin cmake 3.28 to avoid CMP0175 generate-step cycle check in cmake 3.31+
        sudo rm -f /usr/local/bin/cmake /usr/local/bin/cpack /usr/local/bin/ctest

    - name: Rebuild and Install CogUtil
      run: |
        set -eu
        mkdir -p cogutil/build
        cd cogutil/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Configure AtomSpace
      run: |
        set -eu
        mkdir -p atomspace/build
        cd atomspace/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_DISABLE_FIND_PACKAGE_Cxxtest=TRUE

    - name: Build AtomSpace
      run: |
        set -eu
        cd atomspace/build
        make ${{ env.MAKEFLAGS }}

    - name: Build AtomSpace Tests
      run: |
        set -eu
        cd atomspace/build
        make ${{ env.MAKEFLAGS }} tests

    - name: Run AtomSpace Tests
      run: |
        set -eu
        cd atomspace/build
        make check ARGS="${{ env.MAKEFLAGS }}"
      continue-on-error: true

    - name: Print Test Log
      if: always()
      run: |
        set -eu
        if [ -f atomspace/build/tests/Testing/Temporary/LastTest.log ]; then
          cat atomspace/build/tests/Testing/Temporary/LastTest.log
        fi

    - name: Install AtomSpace
      run: |
        set -eu
        cd atomspace/build
        sudo make install
        sudo ldconfig

    - name: Build Examples
      run: |
        set -eu
        cd atomspace/build
        make ${{ env.MAKEFLAGS }} examples
      continue-on-error: true

    - name: Upload AtomSpace Build
      uses: actions/upload-artifact@v6
      with:
        name: atomspace-build
        path: |
          atomspace/build/**/*.so*
          atomspace/build/**/*.a
        retention-days: 1

  # Stage 3: Build AtomSpace Storage (depends on AtomSpace)
  build-atomspace-storage:
    runs-on: ubuntu-latest
    name: Build AtomSpace Storage
    needs: build-atomspace

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Install Dependencies
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          cxxtest \
          binutils-dev \
          libiberty-dev \
          libboost-dev \
          libboost-filesystem-dev \
          libboost-program-options-dev \
          libboost-system-dev \
          libboost-thread-dev \
          guile-3.0-dev \
          \
          python3-nose \
          python3-dev \
          valgrind \
          doxygen
        # Pin cmake 3.28 to avoid CMP0175 generate-step cycle check in cmake 3.31+
        sudo rm -f /usr/local/bin/cmake /usr/local/bin/cpack /usr/local/bin/ctest

    - name: Rebuild and Install CogUtil
      run: |
        set -eu
        mkdir -p cogutil/build
        cd cogutil/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Rebuild and Install AtomSpace
      run: |
        set -eu
        mkdir -p atomspace/build
        cd atomspace/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_DISABLE_FIND_PACKAGE_Cxxtest=TRUE
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Check AtomSpace Storage Directory
      run: |
        set -eu
        if [ -d "atomspace-storage" ]; then
          echo "AtomSpace Storage directory exists"
          ls -la atomspace-storage/
        else
          echo "AtomSpace Storage directory not found, skipping build"
          exit 0
        fi

    - name: Configure AtomSpace Storage
      if: hashFiles('atomspace-storage/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p atomspace-storage/build
        cd atomspace-storage/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build AtomSpace Storage
      if: hashFiles('atomspace-storage/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-storage/build
        make ${{ env.MAKEFLAGS }}

    - name: Build Tests
      if: hashFiles('atomspace-storage/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-storage/build
        make ${{ env.MAKEFLAGS }} tests
      continue-on-error: true

    - name: Run Tests
      if: hashFiles('atomspace-storage/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-storage/build
        make check ARGS="${{ env.MAKEFLAGS }}"
      continue-on-error: true

    - name: Install AtomSpace Storage
      if: hashFiles('atomspace-storage/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-storage/build
        sudo make install
        sudo ldconfig

  # Stage 3b: Build AtomSpace Rocks (depends on AtomSpace Storage)
  build-atomspace-rocks:
    runs-on: ubuntu-latest
    name: Build AtomSpace RocksDB Storage
    needs: build-atomspace-storage

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Install Dependencies
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          cxxtest \
          binutils-dev \
          libiberty-dev \
          libboost-dev \
          libboost-filesystem-dev \
          libboost-program-options-dev \
          libboost-system-dev \
          libboost-thread-dev \
          guile-3.0-dev \
          librocksdb-dev \
          \
          python3-nose \
          python3-dev \
          valgrind \
          doxygen
        # Pin cmake 3.28 to avoid CMP0175 generate-step cycle check in cmake 3.31+
        sudo rm -f /usr/local/bin/cmake /usr/local/bin/cpack /usr/local/bin/ctest

    - name: Rebuild and Install CogUtil
      run: |
        set -eu
        mkdir -p cogutil/build
        cd cogutil/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Rebuild and Install AtomSpace
      run: |
        set -eu
        mkdir -p atomspace/build
        cd atomspace/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_DISABLE_FIND_PACKAGE_Cxxtest=TRUE
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Rebuild and Install AtomSpace Storage
      if: hashFiles('atomspace-storage/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p atomspace-storage/build
        cd atomspace-storage/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Verify AtomSpace Storage Installation
      if: hashFiles('atomspace-storage/CMakeLists.txt') != ''
      run: |
        set -eu
        echo "Checking for AtomSpaceStorageConfig.cmake..."
        find /usr/local -name "*AtomSpaceStorage*Config.cmake" || echo "AtomSpaceStorageConfig.cmake not found"
        ls -la /usr/local/lib/cmake/ || echo "No cmake directory"
        ls -la /usr/local/share/cmake/ || echo "No share/cmake directory"

    - name: Check AtomSpace Rocks Directory
      run: |
        set -eu
        if [ -d "atomspace-rocks" ]; then
          echo "AtomSpace Rocks directory exists"
          ls -la atomspace-rocks/
        else
          echo "AtomSpace Rocks directory not found, skipping build"
          exit 0
        fi

    - name: Configure AtomSpace Rocks
      if: hashFiles('atomspace-rocks/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p atomspace-rocks/build
        cd atomspace-rocks/build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          \
          -DCMAKE_PREFIX_PATH="/usr/local/lib/cmake;/usr/local/share/cmake"

    - name: Build AtomSpace Rocks
      if: hashFiles('atomspace-rocks/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-rocks/build
        make ${{ env.MAKEFLAGS }}

    - name: Build Tests
      if: hashFiles('atomspace-rocks/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-rocks/build
        make ${{ env.MAKEFLAGS }} tests
      continue-on-error: true

    - name: Run Tests
      if: hashFiles('atomspace-rocks/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-rocks/build
        make check ARGS="${{ env.MAKEFLAGS }}"
      continue-on-error: true

    - name: Install AtomSpace Rocks
      if: hashFiles('atomspace-rocks/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-rocks/build
        sudo make install
        sudo ldconfig

  # Stage 4: Build CogServer (depends on AtomSpace)
  build-cogserver:
    runs-on: ubuntu-latest
    name: Build CogServer
    needs: build-atomspace-storage

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Install Dependencies
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          cxxtest \
          binutils-dev \
          libiberty-dev \
          libboost-dev \
          libboost-filesystem-dev \
          libboost-program-options-dev \
          libboost-system-dev \
          libboost-thread-dev \
          guile-3.0-dev \
          libasio-dev \
          \
          python3-nose \
          python3-dev \
          valgrind \
          doxygen
        # Pin cmake 3.28 to avoid CMP0175 generate-step cycle check in cmake 3.31+
        sudo rm -f /usr/local/bin/cmake /usr/local/bin/cpack /usr/local/bin/ctest

    - name: Verify Asio Installation
      run: |
        set -eu
        echo "Checking for Asio installation..."
        ls -la /usr/include/asio.hpp || echo "WARNING: asio.hpp not found in /usr/include"
        ls -la /usr/share/pkgconfig/asio.pc || echo "WARNING: asio.pc not found"
        pkg-config --modversion asio || echo "WARNING: Asio not found via pkg-config"
        pkg-config --cflags asio || echo "WARNING: Could not get Asio cflags"

    - name: Rebuild and Install CogUtil
      run: |
        set -eu
        mkdir -p cogutil/build
        cd cogutil/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Rebuild and Install AtomSpace
      run: |
        set -eu
        mkdir -p atomspace/build
        cd atomspace/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_DISABLE_FIND_PACKAGE_Cxxtest=TRUE
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Build and Install AtomSpace Storage
      if: hashFiles('atomspace-storage/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p atomspace-storage/build
        cd atomspace-storage/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig
      continue-on-error: true

    - name: Check CogServer Directory
      run: |
        set -eu
        if [ -d "cogserver" ]; then
          echo "CogServer directory exists"
          ls -la cogserver/
        else
          echo "CogServer directory not found, skipping build"
          exit 0
        fi

    - name: Configure CogServer
      if: hashFiles('cogserver/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p cogserver/build
        cd cogserver/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build CogServer
      if: hashFiles('cogserver/CMakeLists.txt') != ''
      run: |
        set -eu
        cd cogserver/build
        make ${{ env.MAKEFLAGS }}

    - name: Build Tests
      if: hashFiles('cogserver/CMakeLists.txt') != ''
      run: |
        set -eu
        cd cogserver/build
        make ${{ env.MAKEFLAGS }} tests
      continue-on-error: true

    - name: Run Tests
      if: hashFiles('cogserver/CMakeLists.txt') != ''
      run: |
        set -eu
        cd cogserver/build
        make check ARGS="${{ env.MAKEFLAGS }}"
      continue-on-error: true

    - name: Install CogServer
      if: hashFiles('cogserver/CMakeLists.txt') != ''
      run: |
        set -eu
        cd cogserver/build
        sudo make install
        sudo ldconfig

  # Stage 4b: Build AtomSpace Cog (depends on CogServer)
  build-atomspace-cog:
    runs-on: ubuntu-latest
    name: Build AtomSpace Cog Network Storage
    needs: build-cogserver

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Install Dependencies
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          cxxtest \
          binutils-dev \
          libiberty-dev \
          libboost-dev \
          libboost-filesystem-dev \
          libboost-program-options-dev \
          libboost-system-dev \
          libboost-thread-dev \
          guile-3.0-dev \
          libasio-dev \
          \
          python3-nose \
          python3-dev \
          valgrind \
          doxygen
        # Pin cmake 3.28 to avoid CMP0175 generate-step cycle check in cmake 3.31+
        sudo rm -f /usr/local/bin/cmake /usr/local/bin/cpack /usr/local/bin/ctest

    - name: Verify Asio Installation
      run: |
        set -eu
        echo "Checking for Asio installation..."
        ls -la /usr/include/asio.hpp || echo "WARNING: asio.hpp not found in /usr/include"
        ls -la /usr/share/pkgconfig/asio.pc || echo "WARNING: asio.pc not found"
        pkg-config --modversion asio || echo "WARNING: Asio not found via pkg-config"
        pkg-config --cflags asio || echo "WARNING: Could not get Asio cflags"

    - name: Rebuild and Install CogUtil
      run: |
        set -eu
        mkdir -p cogutil/build
        cd cogutil/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Rebuild and Install AtomSpace
      run: |
        set -eu
        mkdir -p atomspace/build
        cd atomspace/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_DISABLE_FIND_PACKAGE_Cxxtest=TRUE
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Rebuild and Install AtomSpace Storage
      if: hashFiles('atomspace-storage/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p atomspace-storage/build
        cd atomspace-storage/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig
      continue-on-error: true

    - name: Rebuild and Install CogServer
      if: hashFiles('cogserver/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p cogserver/build
        cd cogserver/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Check AtomSpace Cog Directory
      run: |
        set -eu
        if [ -d "atomspace-cog" ]; then
          echo "AtomSpace Cog directory exists"
          ls -la atomspace-cog/
        else
          echo "AtomSpace Cog directory not found, skipping build"
          exit 0
        fi

    - name: Configure AtomSpace Cog
      if: hashFiles('atomspace-cog/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p atomspace-cog/build
        cd atomspace-cog/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build AtomSpace Cog
      if: hashFiles('atomspace-cog/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-cog/build
        make ${{ env.MAKEFLAGS }}

    - name: Build Tests
      if: hashFiles('atomspace-cog/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-cog/build
        make ${{ env.MAKEFLAGS }} tests
      continue-on-error: true

    - name: Run Tests
      if: hashFiles('atomspace-cog/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-cog/build
        make check ARGS="${{ env.MAKEFLAGS }}"
      continue-on-error: true

    - name: Install AtomSpace Cog
      if: hashFiles('atomspace-cog/CMakeLists.txt') != ''
      run: |
        set -eu
        cd atomspace-cog/build
        sudo make install
        sudo ldconfig

  # Stage 5: Build Unify (depends on AtomSpace)
  build-unify:
    runs-on: ubuntu-latest
    name: Build Unify
    needs: build-atomspace

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Install Dependencies
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          cxxtest \
          binutils-dev \
          libiberty-dev \
          libboost-dev \
          libboost-filesystem-dev \
          libboost-program-options-dev \
          libboost-system-dev \
          libboost-thread-dev \
          guile-3.0-dev \
          \
          python3-nose \
          python3-dev \
          valgrind \
          doxygen
        # Pin cmake 3.28 to avoid CMP0175 generate-step cycle check in cmake 3.31+
        sudo rm -f /usr/local/bin/cmake /usr/local/bin/cpack /usr/local/bin/ctest

    - name: Rebuild and Install CogUtil
      run: |
        set -eu
        mkdir -p cogutil/build
        cd cogutil/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Rebuild and Install AtomSpace
      run: |
        set -eu
        mkdir -p atomspace/build
        cd atomspace/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_DISABLE_FIND_PACKAGE_Cxxtest=TRUE
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Check Unify Directory
      run: |
        set -eu
        if [ -d "unify" ]; then
          echo "Unify directory exists"
          ls -la unify/
        else
          echo "Unify directory not found, skipping build"
          exit 0
        fi

    - name: Configure Unify
      if: hashFiles('unify/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p unify/build
        cd unify/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build Unify
      if: hashFiles('unify/CMakeLists.txt') != ''
      run: |
        set -eu
        cd unify/build
        make ${{ env.MAKEFLAGS }}

    - name: Build Tests
      if: hashFiles('unify/CMakeLists.txt') != ''
      run: |
        set -eu
        cd unify/build
        make ${{ env.MAKEFLAGS }} tests
      continue-on-error: true

    - name: Run Tests
      if: hashFiles('unify/CMakeLists.txt') != ''
      run: |
        set -eu
        cd unify/build
        make check ARGS="${{ env.MAKEFLAGS }}"
      continue-on-error: true

    - name: Install Unify
      if: hashFiles('unify/CMakeLists.txt') != ''
      run: |
        set -eu
        cd unify/build
        sudo make install
        sudo ldconfig

  # Stage 6: Build URE (depends on AtomSpace and Unify)
  build-ure:
    runs-on: ubuntu-latest
    name: Build URE (Unified Rule Engine)
    needs: build-unify

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Install Dependencies
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          cxxtest \
          binutils-dev \
          libiberty-dev \
          libboost-dev \
          libboost-filesystem-dev \
          libboost-program-options-dev \
          libboost-system-dev \
          libboost-thread-dev \
          guile-3.0-dev \
          \
          python3-nose \
          python3-dev \
          valgrind \
          doxygen
        # Pin cmake 3.28 to avoid CMP0175 generate-step cycle check in cmake 3.31+
        sudo rm -f /usr/local/bin/cmake /usr/local/bin/cpack /usr/local/bin/ctest

    - name: Rebuild and Install CogUtil
      run: |
        set -eu
        mkdir -p cogutil/build
        cd cogutil/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Rebuild and Install AtomSpace
      run: |
        set -eu
        mkdir -p atomspace/build
        cd atomspace/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_DISABLE_FIND_PACKAGE_Cxxtest=TRUE
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Rebuild and Install Unify
      if: hashFiles('unify/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p unify/build
        cd unify/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        make ${{ env.MAKEFLAGS }}
        sudo make install
        sudo ldconfig

    - name: Check URE Directory
      run: |
        set -eu
        if [ -d "ure" ]; then
          echo "URE directory exists"
          ls -la ure/
        else
          echo "URE directory not found, skipping build"
          exit 0
        fi

    - name: Configure URE
      if: hashFiles('ure/CMakeLists.txt') != ''
      run: |
        set -eu
        mkdir -p ure/build
        cd ure/build
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build URE
      if: hashFiles('ure/CMakeLists.txt') != ''
      run: |
        set -eu
        cd ure/build
        make ${{ env.MAKEFLAGS }}

    - name: Build Tests
      if: hashFiles('ure/CMakeLists.txt') != ''
      run: |
        set -eu
        cd ure/build
        make ${{ env.MAKEFLAGS }} tests
      continue-on-error: true

    - name: Run Tests
      if: hashFiles('ure/CMakeLists.txt') != ''
      run: |
        set -eu
        cd ure/build
        make check ARGS="${{ env.MAKEFLAGS }}"
      continue-on-error: true

    - name: Install URE
      if: hashFiles('ure/CMakeLists.txt') != ''
